version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sentinelx-db
    environment:
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx_secure_password
      POSTGRES_DB: sentinelx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx -d sentinelx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelx-backend
    environment:
      DATABASE_URL: postgresql://sentinelx:sentinelx_secure_password@db:5432/sentinelx_db
      SECRET_KEY: sentinelx-super-secret-key-change-in-production-2026
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

